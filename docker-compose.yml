version: '3.8'

services:
    postgres:
        image: postgres:16
        restart: always
        ports:
            - 5432:5432
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=feedback
        volumes:
            - postgres:/var/lib/postgresql/data

#    deportator:
#        build:
#          context: Dockerfile
#        container_name: deportator_si_migrate
#        depends_on: [ postgres ]
#        restart: on-failure
#        working_dir: /app/src
#        environment:
#            - PYTHONPATH=..
#        entrypoint: ['alembic', 'upgrade', 'head']

    feedback:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        env_file:
            - .env
        depends_on:
            - postgres
#            - deportator
        entrypoint: ["uvicorn", "src.app:app", "--host", "0.0.0.0"]

volumes:
    postgres: {}
